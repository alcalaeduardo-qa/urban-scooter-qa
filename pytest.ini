[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
cache_dir = .pytest_cache_local

markers =
    happy_path: Full end-to-end rombo smoke test
    tarea2: Tarea 2 web tests
    tarea3: Tarea 3 mobile tests
    tarea4: Tarea 4 API tests
    tarea5: Tarea 5 happy-path E2E (Opera + Chrome)
    checklist: Checklist-style tests
    validation: Data-validation tests
    web: Tests that use Playwright + Opera
    mobile: Tests that use Appium + Android emulator
    api: Tests that call REST endpoints directly

addopts =
    -v
    --tb=short
    --html=results/report.html
    --self-contained-html

log_cli = true
log_cli_level = INFO
log_format = %(asctime)s | %(levelname)-8s | %(name)s | %(message)s
log_date_format = %H:%M:%S
filterwarnings =
    ignore::DeprecationWarning